<svg xmlns="http://www.w3.org/2000/svg" width="880" height="182" viewBox="0 0 880 182" role="img" aria-label="Principles: Data first, AI second. Evidence by default. No model lock-in. You keep the keys."><title>Principles: Data first, AI second. Evidence by default. No model lock-in. You keep the keys.</title><style>@font-face{font-family:Outfit;font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:Outfit;font-weight:400;src:url(data:font/woff;base64,) format('woff')}</style><defs><linearGradient id="cg14" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F2EE"/></linearGradient><radialGradient id="cr14" cx="1" cy="1" r="0.9" gradientTransform="translate(0 0)"><stop offset="0" stop-color="#FF6B3D" stop-opacity="0.1"/><stop offset="1" stop-color="#FF6B3D" stop-opacity="0"/></radialGradient><linearGradient id="cs14" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0C10" stop-opacity="0.14"/><stop offset="1" stop-color="#0B0C10" stop-opacity="0.08"/></linearGradient></defs><rect x="0.5" y="0.5" width="879" height="181" rx="16" fill="url(#cg14)"/><rect x="0.5" y="0.5" width="879" height="181" rx="16" fill="url(#cr14)"/><rect x="0.5" y="0.5" width="879" height="181" rx="16" fill="none" stroke="url(#cs14)"/><path d="M24 0.75H54" stroke="#FF6B3D" stroke-width="1.5"/><text x="26.0" y="62" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C10" letter-spacing="-0.42" text-anchor="start" >Data first,</text><text x="26.0" y="88" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C1099" letter-spacing="-0.42" text-anchor="start" >AI second.</text><text x="26.0" y="128" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >Models are only as strong</text><text x="26.0" y="147" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >as the data beneath them.</text><path d="M220.0 30V152" stroke="#0B0C1021"/><text x="246.0" y="62" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C10" letter-spacing="-0.42" text-anchor="start" >Evidence</text><text x="246.0" y="88" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C1099" letter-spacing="-0.42" text-anchor="start" >by default.</text><text x="246.0" y="128" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >Every model has to beat an</text><text x="246.0" y="147" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >honest baseline, out of sample.</text><path d="M440.0 30V152" stroke="#0B0C1021"/><text x="466.0" y="62" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C10" letter-spacing="-0.42" text-anchor="start" >No model</text><text x="466.0" y="88" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C1099" letter-spacing="-0.42" text-anchor="start" >lock-in.</text><text x="466.0" y="128" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >Swap providers and models</text><text x="466.0" y="147" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >without rebuilding the stack.</text><path d="M660.0 30V152" stroke="#0B0C1021"/><text x="686.0" y="62" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C10" letter-spacing="-0.42" text-anchor="start" >You keep</text><text x="686.0" y="88" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C1099" letter-spacing="-0.42" text-anchor="start" >the keys.</text><text x="686.0" y="128" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >Code, data and models are</text><text x="686.0" y="147" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >handed over — yours to own.</text></svg>