<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" role="img" aria-label="Principles: Data first, AI second. Evidence by default. No model lock-in. You keep the keys."><title>Principles: Data first, AI second. Evidence by default. No model lock-in. You keep the keys.</title><style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:Outfit;font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:Outfit;font-weight:400;src:url(data:font/woff;base64,) format('woff')}</style><rect x="0.5" y="0.5" width="879" height="213" rx="16" fill="#F7F6F2" stroke="#0B0C1021"/><text x="26.0" y="46" font-family="JBM" font-weight="400" font-size="11.5" fill="#FF6B3D" letter-spacing="1.15" text-anchor="start" >01</text><text x="26.0" y="90" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C10" letter-spacing="-0.42" text-anchor="start" >Data first,</text><text x="26.0" y="116" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C1099" letter-spacing="-0.42" text-anchor="start" >AI second.</text><text x="26.0" y="156" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >Models are only as strong</text><text x="26.0" y="175" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >as the data beneath them.</text><path d="M220.0 26V188" stroke="#0B0C1021"/><text x="246.0" y="46" font-family="JBM" font-weight="400" font-size="11.5" fill="#FF6B3D" letter-spacing="1.15" text-anchor="start" >02</text><text x="246.0" y="90" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C10" letter-spacing="-0.42" text-anchor="start" >Evidence</text><text x="246.0" y="116" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C1099" letter-spacing="-0.42" text-anchor="start" >by default.</text><text x="246.0" y="156" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >Every model has to beat an</text><text x="246.0" y="175" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >honest baseline, out of sample.</text><path d="M440.0 26V188" stroke="#0B0C1021"/><text x="466.0" y="46" font-family="JBM" font-weight="400" font-size="11.5" fill="#FF6B3D" letter-spacing="1.15" text-anchor="start" >03</text><text x="466.0" y="90" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C10" letter-spacing="-0.42" text-anchor="start" >No model</text><text x="466.0" y="116" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C1099" letter-spacing="-0.42" text-anchor="start" >lock-in.</text><text x="466.0" y="156" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >Swap providers and models</text><text x="466.0" y="175" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >without rebuilding the stack.</text><path d="M660.0 26V188" stroke="#0B0C1021"/><text x="686.0" y="46" font-family="JBM" font-weight="400" font-size="11.5" fill="#FF6B3D" letter-spacing="1.15" text-anchor="start" >04</text><text x="686.0" y="90" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C10" letter-spacing="-0.42" text-anchor="start" >You keep</text><text x="686.0" y="116" font-family="Outfit" font-weight="500" font-size="21" fill="#0B0C1099" letter-spacing="-0.42" text-anchor="start" >the keys.</text><text x="686.0" y="156" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >Code, data and models are</text><text x="686.0" y="175" font-family="Outfit" font-weight="400" font-size="12.8" fill="#0B0C1099" text-anchor="start" >handed over — yours to own.</text></svg>